<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宅地建物取引業・免許 ③取引とは</title>
<style>
:root{--bg:#f6f2ec;--panel:#fdfbf7;--fg:#332e28;--muted:#8a8074;--acc:#c98b9b;--accd:#a9647a;
 --line:#e8e0d8;--soft:#f2ece4;--chip:#f5e8eb;--ok:#5c8a63;--ng:#c4736c;--gnd:#cfc3b2;
 --in:#dbe8f2;--ind:#4a6579}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:system-ui,"Yu Gothic UI",sans-serif;min-height:100vh;padding:0 0 116px;
 display:flex;flex-direction:column}
/* 図と字幕をひとまとめにして、上下の中央に置く（2026-08-25 本人指示） */
.mid{flex:1 0 auto;display:flex;flex-direction:column;justify-content:center}
.w{max-width:430px;margin:0 auto;padding:0 14px;width:100%;
 flex:1 0 auto;display:flex;flex-direction:column}
header{padding:14px 0 6px;text-align:center}
.kick{font-size:10.5px;color:var(--accd);letter-spacing:.14em;font-weight:700}
h1{font-size:19px;margin:4px 0 0}
.stage{margin:6px 0 0}
svg{width:100%;height:auto;display:block}
/* 字幕 */
.sub{padding:12px 4px 4px;text-align:center;min-height:5.2em}
.sub .l{font-size:15px;font-weight:600;line-height:1.85;
 opacity:0;transform:translateY(6px);transition:opacity .3s ease,transform .3s ease}
.sub .l.in{opacity:1;transform:none}
/* 操作 */
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(246,242,236,.97);
 border-top:1px solid var(--line);padding:9px 14px 14px;z-index:5}
.in2{max-width:430px;margin:0 auto;display:flex;gap:11px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);
 background:var(--panel);color:var(--fg);border-radius:99px;padding:10px 15px;font-size:13px;
 cursor:pointer;font-family:inherit}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn:active{transform:scale(.97)}
.ico{width:16px;height:16px;flex:0 0 auto}
.pg{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s linear}
.tm{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.btn.ic{padding:9px 12px;font-size:12px}
.seek{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:transparent;margin:0}
.seek::-webkit-slider-runnable-track{height:5px;border-radius:99px;background:var(--line)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;
 border-radius:50%;background:var(--acc);border:2px solid #fff;margin-top:-5.5px;
 box-shadow:0 1px 3px rgba(0,0,0,.18)}
.seek::-moz-range-track{height:5px;border-radius:99px;background:var(--line)}
.seek::-moz-range-thumb{width:16px;height:16px;border:2px solid #fff;border-radius:50%;
 background:var(--acc)}
/* 舞台 */
#st{transition:transform .4s ease}
#st g{transition:opacity .45s ease,transform .55s cubic-bezier(.2,.85,.3,1)}
#st .o{opacity:0}
#st .o.on{opacity:1}
#st .rise{transform:translateY(22px)}
#st .rise.on{transform:none}
#st .pop{transform:scale(.66);transform-origin:center}
#st .pop.on{transform:none}
.lbl rect{fill:var(--panel);stroke:var(--acc);stroke-width:1.6}
.lbl text{fill:var(--accd);font-weight:700}
.lbl.b rect{fill:var(--chip)}
.lbl.n rect{stroke:var(--ng)}
.lbl.n text{fill:var(--ng)}
.lbl.i rect{stroke:#7fa7c4}
.lbl.i text{fill:var(--ind)}
.chip rect{fill:#e7f0e8;stroke:#8fb596;stroke-width:1.6}
.chip text{fill:#3f6b46;font-weight:700}
.gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;
 justify-content:center;padding:22px}
.gate.off{display:none}
.gin{max-width:380px;text-align:center;background:linear-gradient(180deg,#f9eef1,#fdfbf7);
 border:1px solid var(--line);border-radius:20px;padding:28px 20px 24px}
.gt{font-size:24px;font-weight:700;line-height:1.45;margin:10px 0 12px}
.gs{font-size:12.5px;color:var(--muted);line-height:1.95;margin:0 0 20px}
.gbtns{display:flex;flex-direction:column;gap:9px;align-items:center}
</style>

<div class="gate" id="gate"><div class="gin">

 <div class="gs">図が動きます。字幕も出ます。<br>約62秒 → そのあと3問。</div>
 <div class="gbtns">
  <button class="btn pri" id="start" style="padding:14px 28px;font-size:15px">
  <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>講義を始める</button>

  <button class="btn" id="tohome" style="padding:12px 22px">ホームへ戻る</button>
 </div>
</div></div>

var RATE=1.30;
var st=document.getElementById('st'),sub=document.getElementById('sub');
var A=new Audio(),ci=0,playing=false,subT=[];
var TOT=STEPS.reduce(function(a,s){return a+((L1[s.id]||{}).d||0)},0);
function setScene(list){
  ALL.forEach(function(k){
    if(list.indexOf(k)<0){var e=st.querySelector('.'+k);if(e)e.classList.remove('on')}
  });
  list.forEach(function(k,i){
    setTimeout(function(){
      var e=st.querySelector('.'+k);
      if(e){e.classList.add('on');
        e.querySelectorAll('.o').forEach(function(c){c.classList.add('on')})}
      if(i===list.length-1)fitStage(list);
    },i*200);
  });
  fitStage(list);
}
/* ★出ている図に合わせて舞台を寄せる（2026-08-25 本人指示「なるべく画面の中心に持ってくる」）。
   舞台は 360x300 で固定していたので、段階によっては上半分が空いて図が下に寄り、
   しかも小さく見えていた（実測：導入の段階は上150pxが空白）。
   いま出ているレイヤーの外枠を測って viewBox をそこへ寄せる＝どの段階でも中央・大きく出る。 */
var VB0=[0,0,360,300];
function fitStage(list){
  var x1=1e9,y1=1e9,x2=-1e9,y2=-1e9,n=0;
  for(var i=0;i<list.length;i++){
    var e=st.querySelector('.'+list[i]);
    if(!e)continue;
    var b;try{b=e.getBBox()}catch(err){continue}
    if(!b||(!b.width&&!b.height))continue;
    x1=Math.min(x1,b.x);y1=Math.min(y1,b.y);
    x2=Math.max(x2,b.x+b.width);y2=Math.max(y2,b.y+b.height);n++;
  }
  if(!n){st.setAttribute('viewBox',VB0.join(' '));return}
  var pad=10;
  x1-=pad;y1-=pad;x2+=pad;y2+=pad;
  var w=x2-x1,h=y2-y1;
  /* 縦横の比は舞台と同じに保つ（伸び縮みで絵が歪まないように） */
  var ar=VB0[2]/VB0[3];
  if(w/h<ar){var w2=h*ar;x1-=(w2-w)/2;w=w2}else{var h2=w/ar;y1-=(h2-h)/2;h=h2}
  /* 拡大しすぎない（小さい図が不自然に大写しにならないように） */
  var min=VB0[2]*0.55;
  if(w<min){var k=min/w;x1-=(min-w)/2;y1-=(min/ar-h)/2;w=min;h=min/ar}
  st.setAttribute('viewBox',[x1.toFixed(1),y1.toFixed(1),w.toFixed(1),h.toFixed(1)].join(' '));
}
function setSub(lines,sec){
  subT.forEach(clearTimeout);subT=[];sub.innerHTML='';
  var each=Math.max(1.0,(sec/RATE)/lines.length);
  lines.forEach(function(t,i){
    subT.push(setTimeout(function(){
      sub.innerHTML='<div class="l">'+t+'</div>';
      var e=sub.querySelector('.l');setTimeout(function(){if(e)e.classList.add('in')},20);
    },i*each*1000));
  });
}
function step(n){
  ci=n;
  if(n>=STEPS.length){done();return}
  var s=STEPS[n],r=L1[s.id]||{d:5,say:['']};
  setScene(s.show);setSub(r.say,r.d);
  A.src=AU[s.id]||'';A.playbackRate=RATE;
  A.play().then(function(){playing=true;A.playbackRate=RATE;ppt()})
          .catch(function(){playing=false;ppt()});
}
A.addEventListener('ended',function(){step(ci+1)});
function ppt(){document.getElementById('ppt').textContent=playing?'一時停止':'再生'}
document.getElementById('pp').onclick=function(){
  if(playing){A.pause();playing=false}else{A.play().catch(function(){});playing=true}ppt();
};
/* ---- 全体を1本の時間軸として扱う（どこへでも飛べるように。2026-08-25 本人指示） ---- */
function startOf(n){return STEPS.slice(0,n).reduce(function(a,s){return a+((L1[s.id]||{}).d||0)},0)}
function nowSec(){return startOf(ci)+(A.currentTime||0)}
function seekTo(sec){
  sec=Math.max(0,Math.min(TOT-0.05,sec));
  for(var i=STEPS.length-1;i>=0;i--){
    if(sec>=startOf(i)){
      var off=sec-startOf(i);
      if(i===ci){A.currentTime=off}
      else{
        var was=playing;
        ci=i;
        var r=L1[STEPS[i].id]||{d:5,say:['']};
        setScene(STEPS[i].show);setSub(r.say,r.d);
        A.src=AU[STEPS[i].id]||'';
        A.playbackRate=RATE;
        A.addEventListener('loadedmetadata',function h(){
          A.removeEventListener('loadedmetadata',h);A.currentTime=off;
          if(was){A.play().catch(function(){})}
        });
      }
      break;
    }
  }
}
var drag=false;
var seek=document.getElementById('seek');
seek.addEventListener('input',function(){drag=true});
seek.addEventListener('change',function(){
  drag=false;seekTo(TOT*(+seek.value)/1000);
});
document.getElementById('back').onclick=function(){seekTo(nowSec()-10*RATE)};
var RATES=[1.0,1.15,1.3,1.5,1.75],ri=2;
document.getElementById('rate').onclick=function(){
  ri=(ri+1)%RATES.length;RATE=RATES[ri];A.playbackRate=RATE;
  this.textContent=RATE.toFixed(2).replace(/0$/,'').replace(/\.$/,'')+'倍';
};
var vr=document.getElementById('volr');
document.getElementById('vol').onclick=function(){
  var r=document.getElementById('volrow');r.hidden=!r.hidden;
};
vr.addEventListener('input',function(){
  A.volume=(+vr.value)/100;document.getElementById('volv').textContent=vr.value;
});
function mmss(x){x=Math.max(0,Math.round(x));return Math.floor(x/60)+':'+('0'+(x%60)).slice(-2)}
setInterval(function(){
  var d=nowSec();
  if(!drag)seek.value=Math.round(TOT?d/TOT*1000:0);
  document.getElementById('pgi')&&(document.getElementById('pgi').style.width='');
  document.getElementById('tmn').textContent=mmss(d/RATE);
  document.getElementById('tm').textContent='-'+mmss((TOT-d)/RATE);
},150);
/* アプリの中に埋め込まれているか（?embed=1）。埋め込みなら画面を読み直さず、
   親（アプリ）に知らせて閉じてもらう＝起動演出が挟まらず、読み上げも鳴る。 */
var EMB=/[?&]embed=1/.test(location.search);
function toApp(msg){
  if(EMB){try{parent.postMessage({takken:msg,ids:IDQ},'*')}catch(e){}return}
  if(msg==='home'){location.href='../app.html';return}
  location.href='../index.html#q='+encodeURIComponent(IDQ.join(','));
}
function done(){playing=false;ppt();toApp('lessonDone');}
document.getElementById('start').onclick=function(){
  document.getElementById('gate').classList.add('off');step(0);};
document.getElementById('toq').onclick=function(){
  /* 講義を飛ばして問題へ（2026-08-25 本人指示） */
  playing=false;try{A.pause()}catch(e){}toApp('lessonDone');};
document.getElementById('tohome').onclick=function(){
  playing=false;try{A.pause()}catch(e){}toApp('home');};
/* 撮って自分で見るための入口（tools/show.py 用。?open=1&st=a8 など） */
if(/[?&]open=1/.test(location.search)){
  document.getElementById('gate').classList.add('off');
  var m=/[?&]st=(a\d+)/.exec(location.search),to=m?m[1]:'a10';
  for(var k=0;k<STEPS.length;k++){
    if(STEPS[k].id===to){setScene(STEPS[k].show);
      setSub([(L1[to]||{say:['']}).say[0]],2);break}
  }
}
