name: Deploy to GitHub Pages

# push すれば公開される。Pages の設定も初回に自動で有効化する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 問題データが混ざっていないか確認する
        run: |
          if ls *.json 1> /dev/null 2>&1; then
            echo "JSON が含まれています。問題データの混入を疑ってください。"; exit 1
          fi
          total=$(du -sk . --exclude=.git | cut -f1)
          if [ "$total" -gt 1024 ]; then
            echo "1MB を超えています（${total}KB）。データ混入の疑い。"; exit 1
          fi
          echo "OK: ${total}KB"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
