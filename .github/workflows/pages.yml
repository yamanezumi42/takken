name: Deploy to GitHub Pages

# push すれば公開される。Pages の設定も初回に自動で有効化する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 問題データが混ざっていないか確認する
        run: |
          # ★大きさだけで見るのはやめた（2026-08-25）。講義の音を埋め込んだら
          #   中身は正しいのに 2MB を超えて止まり、配信が黙って落ちた。
          #   見るべきは大きさではなく**問題データが混ざっていないか**そのもの。
          if ls *.json 1> /dev/null 2>&1; then
            echo "JSON が含まれています。問題データの混入を疑ってください。"; exit 1
          fi
          # 問題データの鍵（解説・問題文・選択肢）が平文で入っていないこと。
          # 殻は IndexedDB から読むので、これらが本文にあれば混入。
          if grep -rlE '"(exp|stem|choices|qtext)"[[:space:]]*:' \
               --include=*.html --include=*.js --include=*.css . ; then
            echo "問題データらしい鍵が見つかりました。混入を疑ってください。"; exit 1
          fi
          total=$(du -sk . --exclude=.git | cut -f1)
          if [ "$total" -gt 8192 ]; then
            echo "8MB を超えました（${total}KB）。置き場所を見直してください。"; exit 1
          fi
          echo "OK: ${total}KB"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
